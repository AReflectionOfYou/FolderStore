<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FolderStore prototype</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 860px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  label { display: block; font-size: 0.85rem; margin-top: 0.5rem; color: #555; }
  input, select { width: 100%; padding: 0.4rem; margin-top: 0.2rem; box-sizing: border-box; }
  button { margin-top: 0.7rem; padding: 0.45rem 0.9rem; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 0.7rem; font-size: 0.9rem; }
  td, th { text-align: left; padding: 0.25rem 0.4rem; border-bottom: 1px solid #eee; }
  pre { background: #f6f6f6; padding: 0.6rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  .row { display: flex; gap: 0.6rem; }
  .row > div { flex: 1; }
  #status { font-weight: 600; }
</style>
</head>
<body>
<h1>FolderStore prototype</h1>
<p>Current adapter: <span id="status">none</span></p>

<section>
  <h2>1. Choose an adapter</h2>
  <label>Provider
    <select id="provider">
      <option value="local">Local folder</option>
      <option value="dropbox">Dropbox (needs a token from the CLI's auth-dropbox)</option>
      <option value="gdrive">Google Drive (needs a token from the CLI's auth-gdrive)</option>
    </select>
  </label>
  <label id="rootLabel">Root directory (local) / Dropbox path
    <input id="root" placeholder="./sandbox or /FamilyPhotos" />
  </label>
  <label id="folderIdLabel" style="display:none">Drive root folder ID
    <input id="rootFolderId" />
  </label>
  <button id="connect">Connect</button>
</section>

<section>
  <h2>2. Browse</h2>
  <div class="row">
    <div>
      <label>Path (empty = project root)
        <input id="listPath" value="" />
      </label>
      <button id="listBtn">List</button>
    </div>
  </div>
  <table id="listing"><thead><tr><th>Type</th><th>Size</th><th>Modified</th><th>Path</th></tr></thead><tbody></tbody></table>
</section>

<section>
  <h2>3. Read a file</h2>
  <label>Path
    <input id="readPath" />
  </label>
  <button id="readBtn">Read</button>
  <pre id="readOutput"></pre>
</section>

<section>
  <h2>4. Write a file (never overwrites)</h2>
  <label>Path
    <input id="writePath" placeholder="IMG_0412.story.amy.2026-11-16T105200Z.json" />
  </label>
  <label>Text content
    <input id="writeContent" placeholder="hello world" />
  </label>
  <button id="writeBtn">Write</button>
  <pre id="writeOutput"></pre>
</section>

<section>
  <h2>5. Delete (moves to trash)</h2>
  <label>Path
    <input id="deletePath" />
  </label>
  <button id="deleteBtn">Delete</button>
  <pre id="deleteOutput"></pre>
</section>

<section>
  <h2>6. Changes since a cursor</h2>
  <label>Cursor (empty = from the start)
    <input id="cursor" />
  </label>
  <button id="changesBtn">Get changes</button>
  <pre id="changesOutput"></pre>
</section>

<script>
  const $ = (id) => document.getElementById(id);

  $("provider").addEventListener("change", () => {
    const isGdrive = $("provider").value === "gdrive";
    $("folderIdLabel").style.display = isGdrive ? "block" : "none";
    $("rootLabel").style.display = isGdrive ? "none" : "block";
  });

  async function api(path, options) {
    const res = await fetch(path, options);
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || res.statusText);
    return body;
  }

  $("connect").addEventListener("click", async () => {
    const type = $("provider").value;
    const config = { type };
    if (type === "gdrive") config.rootFolderId = $("rootFolderId").value;
    else config.root = $("root").value;
    try {
      const result = await api("/api/adapter", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(config),
      });
      $("status").textContent = result.adapter;
    } catch (err) {
      $("status").textContent = `error: ${err.message}`;
    }
  });

  $("listBtn").addEventListener("click", async () => {
    const tbody = document.querySelector("#listing tbody");
    tbody.innerHTML = "";
    try {
      const entries = await api(`/api/list?path=${encodeURIComponent($("listPath").value)}`);
      for (const e of entries) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${e.type}</td><td>${e.size}</td><td>${e.modifiedAt}</td><td>${e.path}</td>`;
        tbody.appendChild(tr);
      }
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="4">${err.message}</td></tr>`;
    }
  });

  $("readBtn").addEventListener("click", async () => {
    try {
      const result = await api(`/api/read?path=${encodeURIComponent($("readPath").value)}`);
      $("readOutput").textContent = atob(result.base64);
    } catch (err) {
      $("readOutput").textContent = `error: ${err.message}`;
    }
  });

  $("writeBtn").addEventListener("click", async () => {
    try {
      const contentBase64 = btoa($("writeContent").value);
      const entry = await api("/api/write", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: $("writePath").value, contentBase64 }),
      });
      $("writeOutput").textContent = JSON.stringify(entry, null, 2);
    } catch (err) {
      $("writeOutput").textContent = `error: ${err.message}`;
    }
  });

  $("deleteBtn").addEventListener("click", async () => {
    try {
      await api("/api/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: $("deletePath").value }),
      });
      $("deleteOutput").textContent = "deleted (trashed)";
    } catch (err) {
      $("deleteOutput").textContent = `error: ${err.message}`;
    }
  });

  $("changesBtn").addEventListener("click", async () => {
    try {
      const result = await api(`/api/changes?cursor=${encodeURIComponent($("cursor").value)}`);
      $("changesOutput").textContent = JSON.stringify(result, null, 2);
    } catch (err) {
      $("changesOutput").textContent = `error: ${err.message}`;
    }
  });
</script>
</body>
</html>
